name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK + CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null

      - name: Cache ncnn download
        uses: actions/cache@v4
        with:
          path: app/.deps
          key: ncnn-20260526-arm64-v8a

      - name: Build release APK (debug-key signed, installable)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/SDR2HDR-v0.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDR2HDR-release-apk
          path: artifact/SDR2HDR-v0.0.1.apk
